<!doctype html>
<html lang="en" data-ds-theme="light" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation · standalone</title>
<link rel="stylesheet" href="../../foundations/tokens.css"><link rel="stylesheet" href="../../foundations/primitives.css"><link rel="stylesheet" href="../breadcrumbs/breadcrumbs.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="../../icons/assets/icons.css">
<style>
body{margin:0;background:var(--ds-colour-panel);font-family:var(--ds-font-family)}
#viewport{container:ui-preview / inline-size;width:100%;min-height:100dvh}
#menu-live{min-height:100dvh}.example-content{max-width:70ch;line-height:1.7}.example-content h1{margin-top:0}
.example-utilities{display:flex;flex-direction:column;gap:3px}.example-utilities button{min-height:36px;border:0;background:transparent;color:var(--ds-colour-muted)}
</style>
<div id="viewport"><div id="menu-live" data-sidebar-collapsed="false"></div></div>
<script src="../../icons/assets/icons.js"></script><script src="../breadcrumbs/breadcrumbs.js"></script><script src="navigation.js"></script>
<script>
const root=document.getElementById('menu-live'),viewport=document.getElementById('viewport');
DesignSystemNavigation.renderStructure(root,{user:{initials:'AK',label:'Account'}});
const icon=name=>DesignSystemIcons.svg(({dashboard:'layout-dashboard'})[name]||name);
const navigation=[{page:'dashboard',label:'Dashboard',icon:'dashboard'},{group:'components',label:'Components',icon:'folder',pages:[['forms','Forms'],['tabs','Tabs'],['breadcrumbs','Breadcrumbs']]},{group:'orders',label:'Orders',icon:'folder',pages:[['board','Kanban board'],['list','Order list']]}];
DesignSystemNavigation.renderNavigation(root,navigation,{renderIcon:icon,submenuIcons:{forms:'type',tabs:'folder',breadcrumbs:'type',board:'folder',list:'folder'}});
const shell=DesignSystemNavigation.mount(root,{viewport,renderIcon:icon,storage:{getItem:key=>localStorage.getItem(key),setItem:(key,value)=>localStorage.setItem(key,value)},storageKey:'standalone-shell',onNavigate:navigate});
root.dataset.popupPattern='soft';shell.slots.header.prepend(shell.sidebarToggle);
const items=document.createElement('div');items.className='workspace-nav-items';Array.from(shell.slots.navigation.children).filter(node=>node!==shell.slots.footer).forEach(node=>items.append(node));shell.slots.navigation.prepend(items);
const utilities=document.createElement('div');utilities.className='example-utilities';shell.slots.footer.append(utilities);
['Light','Dark','Matrix'].forEach(theme=>{const button=document.createElement('button');button.type='button';button.textContent=theme;button.setAttribute('aria-label',theme+' theme');button.addEventListener('click',()=>{document.documentElement.dataset.dsTheme=theme.toLowerCase();document.documentElement.dataset.theme=theme.toLowerCase()});utilities.append(button)});
const mobile=shell.installMobile();shell.installOverflow({items,footer:shell.slots.footer,nav:shell.slots.navigation});
const breadcrumbs=DesignSystemBreadcrumbs.mount(shell.slots.breadcrumbs,{items:[],onNavigate:item=>navigate(item.id)});
function navigate(page){shell.select(page);const entry=navigation.find(entry=>entry.page===page||entry.pages?.some(item=>item[0]===page));if(!entry)return;const label=entry.pages?.find(item=>item[0]===page)?.[1]||entry.label;breadcrumbs.update({items:[{id:'dashboard',label:'topschrank',href:'#dashboard',emphasisLength:3},...(entry.group?[{id:entry.pages[0][0],label:entry.group,href:'#'+entry.pages[0][0]}]:[]),{id:page,label:label.toLowerCase().replaceAll(' ',''),href:'#'+page}]});shell.slots.content.replaceChildren();const content=document.createElement('div');content.className='example-content';const h=document.createElement('h1');h.textContent=label;content.append(h);const p=document.createElement('p');p.textContent='The shell owns navigation, responsive layout, focus, animations and menu overflow. Page content, icons, theme controls and Breadcrumbs are supplied by the application.';content.append(p);shell.slots.content.append(content);history.replaceState(null,'','#'+page);if(mobile.isMobile())mobile.setOpen(false)}
navigate(location.hash.slice(1)||'dashboard');requestAnimationFrame(()=>requestAnimationFrame(()=>root.dataset.motionReady='true'));
window.addEventListener('pagehide',()=>shell.remember());
</script></html>
