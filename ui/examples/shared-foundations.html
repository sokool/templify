<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breadcrumbs + Tabs · shared foundations</title>
<link rel="stylesheet" href="../defaults.css"><link rel="stylesheet" href="../primitives.css">
<link rel="stylesheet" href="../components/breadcrumbs/breadcrumbs.css"><link rel="stylesheet" href="../components/tabs/tabs.css">
<script src="../components/breadcrumbs/breadcrumbs.js"></script><script src="../components/tabs/tabs.js"></script>
<style>body{margin:0;padding:clamp(16px,4vw,48px);font:14px/1.5 var(--ds-font-family);color:var(--ds-colour-text);background:var(--ds-colour-panel)}main{max-width:900px;margin:auto}section{margin-top:32px;padding:24px 0;border-top:1px solid var(--ds-colour-border)}h2{font-size:16px}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}button{font:inherit;padding:6px 10px}label{display:flex;align-items:center;gap:8px}</style>
</head><body><main>
<h1>One foundation · two independent components</h1>
<p>Change the shared accent: both components react to the same token without changing either implementation. Shared CSS is loaded once.</p>
<div class="controls"><label>Shared accent <input id="accent" type="color" value="#22447F"></label><button type="button" id="theme">Change theme</button></div>
<section><h2>Breadcrumbs</h2><nav id="path"></nav></section>
<section><h2>Tabs</h2><div id="details"></div></section>
</main><script>
DesignSystemBreadcrumbs.mount(document.getElementById('path'),{items:[{label:'topschrank',emphasisLength:3,href:'#home'},{label:'components',href:'#components'},{label:'tabs',href:'#tabs'}]});
DesignSystemTabs.mount(document.getElementById('details'),{label:'Product information',items:[{id:'materials',label:'Materials',content:'Component-specific content; shared colours and focus.'},{id:'details',label:'Details',content:'Only the tokens and opt-in CSS primitives are shared.'},{id:'service',label:'Service',content:'Tabs does not import or call Breadcrumbs.'}]});
document.getElementById('accent').addEventListener('input',event=>document.documentElement.style.setProperty('--ds-colour-accent',event.target.value));
let theme=0;document.getElementById('theme').addEventListener('click',()=>{theme=(theme+1)%3;document.documentElement.dataset.dsTheme=['light','dark','matrix'][theme]});
</script></body></html>
