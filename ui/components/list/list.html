<!--
Component: List
Purpose: Tabular data with local pagination.
Elements: Density toolbar, table with headers and rows, summary and page navigation.
JavaScript behavior: setPage(n), setDensity("normal|compact"), ui:page; data-page-size
sets the number of rows per page. Pagination uses the supplied rows; for server-side
pagination, omit data-list-page and use links with hx-get.
-->
<section class="ds-component ds-list" data-ui="list" data-density="normal" data-page-size="2" aria-label="Projects">
  <div class="ds-list-toolbar"><div class="ds-list-density" role="group" aria-label="Density"><button type="button" class="ds-list-button" data-list-density="normal" aria-pressed="true">Normal</button><button type="button" class="ds-list-button" data-list-density="compact" aria-pressed="false">Compact</button></div></div>
  <div class="ds-list-frame"><table class="ds-list-table"><caption class="ds-list-sr">Projects</caption><thead><tr><th scope="col">Project</th><th scope="col">Status</th></tr></thead><tbody><tr><td>Wardrobe</td><td>In progress</td></tr><tr><td>Kitchen</td><td>Ready</td></tr><tr><td>Office</td><td>Planned</td></tr></tbody></table></div>
  <div class="ds-list-footer"><span class="ds-list-summary" data-list-summary role="status">3 projects</span><nav class="ds-list-pagination" aria-label="Project pages"><button type="button" class="ds-list-button" data-list-page="previous">Previous</button><button type="button" class="ds-list-button" data-list-page="next">Next</button></nav></div>
</section>
