<!doctype html>
<html lang="en" data-ds-theme="light" data-theme="light">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation · standalone</title>
<link rel="stylesheet" href="../../defaults.css"><link rel="stylesheet" href="../../primitives.css">
<link rel="stylesheet" href="../form/form.css"><link rel="stylesheet" href="navigation.css">
<link rel="stylesheet" href="../shortcuts/shortcuts.css">
<link rel="stylesheet" href="../window/window.css"><link rel="stylesheet" href="../search/search.css">
<style>
body{margin:0;font-family:var(--ds-font-family)}
.navigation-viewport,#menu-live{min-height:100dvh}
.example-controls{display:flex;flex-wrap:wrap;gap:16px;margin-block:24px}
</style>
<div class="navigation-viewport">
  <section id="menu-live" data-collapse="true" data-search="true" data-search-shortcut="Mod+K" data-collapse-shortcut="Mod+B"></section>
</div>
<script src="../shortcuts/shortcuts.js"></script><script src="../form/validation.js"></script>
<script src="../form/pickers.js"></script><script src="../form/controls.js"></script>
<script src="../form/field.js"></script><script src="../window/window.js"></script>
<script src="../search/search.js"></script><script src="navigation.js"></script>
<script>
const root = document.getElementById('menu-live');
DesignSystemNavigation.renderStructure(root);
const shell = DesignSystemNavigation.mount(root, {
  items: [
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', href: '#dashboard' },
    { id: 'projects', label: 'Projects', icon: 'folder', children: [
      { id: 'all-projects', label: 'All projects', icon: 'list', href: '#projects' },
      { id: 'new-project', label: 'New project', icon: 'plus', onClick: () => { document.querySelector('#action-status').textContent = 'New project action executed.'; } },
    ] },
  ],
  onNavigate(id) { shell.select(id); },
});
shell.slots.breadcrumbs.textContent = 'Navigation';
shell.slots.content.innerHTML = `
  <h1>Standalone Navigation</h1>
  <p>Native links, callback actions, shared Shortcuts, search, folding and mobile navigation. No workspace files are loaded.</p>
  <div class="example-controls">
    <label><input type="checkbox" id="allow-collapse" checked> Allow folding</label>
    <label><input type="checkbox" id="allow-search" checked> Menu search</label>
    <label><input type="checkbox" id="allow-dock"> Bottom action dock</label>
    <label>Main menu <select id="menu-position"><option>left</option><option>right</option><option>top</option><option>bottom</option></select></label>
    <label>Mobile drawer <select id="mobile-position"><option value="">Follow menu side</option><option>left</option><option>right</option></select></label>
  </div>
  <p id="action-status" role="status">Choose a menu item or search with Cmd/Ctrl+K.</p>
  <h2>Shared keyboard shortcuts</h2><div id="shortcut-editor"></div>`;
document.getElementById('allow-collapse').addEventListener('change', event => shell.setCollapse(event.target.checked));
document.getElementById('allow-search').addEventListener('change', event => { root.dataset.search = String(event.target.checked); });
document.getElementById('allow-dock').addEventListener('change', event => shell.setDock(event.target.checked));
document.getElementById('menu-position').addEventListener('change', event => shell.setPosition(event.target.value));
document.getElementById('mobile-position').addEventListener('change', event => {
  if (event.target.value) shell.setMobilePosition(event.target.value);
  else delete root.dataset.mobilePosition;
});
const unregisterNote = shell.shortcuts.register({
  id: 'notes.create', label: 'Quick note', icon: 'plus', group: 'Notes',
  description: 'Create a note from the bottom dock or Search',
  dock: { order: 10 }, searchable: true, defaultShortcut: null,
  handler() { document.getElementById('action-status').textContent = 'Quick note action executed.'; return true; },
});
const editor = DesignSystemShortcuts.mount(document.getElementById('shortcut-editor'));
shell.select('dashboard');
window.addEventListener('pagehide', event => { if (!event.persisted) { unregisterNote(); editor.destroy(); shell.destroy(); } });
</script>
</html>
