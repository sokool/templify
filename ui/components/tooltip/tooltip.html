<!--
Component: Tooltip
Purpose: Show an additional hint on hover or keyboard focus.
Elements: Container and a data-tooltip trigger; JS creates the auxiliary tooltip.
JavaScript behavior: show(trigger), hide(); positioning, Escape, aria-describedby
and cleanup on removal. Trigger styles are transferred to the tooltip:
--ds-tooltip-bg, --ds-tooltip-text, --ds-tooltip-border, --ds-tooltip-accent,
--ds-tooltip-padding, --ds-tooltip-size. Also works with HTML inserted through HTMX.
-->
<span data-ui="tooltip" style="--ds-tooltip-padding: 8px 11px"><button type="button" class="ds-component ds-button ds-focusable" data-ui="buttons" data-tooltip="Save changes to the project"><span data-button-label>Hover or focus</span></button></span>
