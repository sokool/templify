<!--
Component: Buttons
Purpose: Trigger an action or submit a form.
Elements: Native button, optional DOM/SVG icon and label.
JavaScript behavior: update({label, disabled, icon, variant}); icon accepts a DOM Node
or null. The application/HTMX handles click, submit and hx-* attributes.
Set the variant with data-variant="primary|secondary|ghost|split". JS preserves the button.
-->
<button type="button" class="ds-component ds-button ds-focusable" data-ui="buttons" data-variant="primary">
  <span data-button-icon aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 12 4 4L19 6"/></svg></span>
  <span data-button-label>Save</span>
</button>
