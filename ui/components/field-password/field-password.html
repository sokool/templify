<!--
Component: Password input
Purpose: A masked password field with native length validation.
Elements: Label, password input and inline validation message.
JavaScript behavior: Displays native validation errors and clears them on form reset. Submission remains application-owned.
-->
<div class="ds-component ds-field" data-ui="field-password" data-type="password">
  <div class="ds-field-caption"><label class="ds-field-label" for="field-password-input">Password</label><span class="ds-field-error" data-field-error aria-live="polite" hidden></span></div>
  <div class="ds-field-body"><input class="ds-field-control" id="field-password-input" type="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
</div>
