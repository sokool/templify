<!--
Component: Autocomplete
Purpose: Search and select one or multiple values.
Elements: Labeled combobox input, popup and a list of data-value options.
JavaScript behavior: Filtering, keyboard navigation, opening/closing, selection,
removable chips, hidden form fields and ui:change. API: open, close, choose, update,
getValue, setQuery. Options: data-size="small|big", data-multiple="true|false", data-name.
The server can supply options and use aria-selected="true" for the initial selection.
-->
<div class="ds-component ds-autocomplete" data-ui="autocomplete" data-size="small" data-multiple="true" data-name="materials">
  <div class="ds-field"><div class="ds-field-caption"><label class="ds-field-label" for="autocomplete-query">Find material</label></div>
    <div class="ds-field-body"><input class="ds-field-control" id="autocomplete-query" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" placeholder="Type a material…" name="query"></div>
  </div>
  <div class="ds-ac-popup" hidden><div class="ds-ac-list" role="listbox" aria-label="Materials">
    <div class="ds-ac-option" role="option" data-value="oak" data-label="Oak" aria-selected="false"><span class="ds-ac-copy"><strong>Oak</strong><small>Natural wood</small></span></div>
    <div class="ds-ac-option" role="option" data-value="steel" data-label="Steel" aria-selected="false"><span class="ds-ac-copy"><strong>Steel</strong><small>Metal fittings</small></span></div>
  </div></div>
</div>
