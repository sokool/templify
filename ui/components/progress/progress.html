<!--
Komponent: Progress
Przeznaczenie: Postęp zadania o znanej lub nieznanej długości.
Elementy: etykieta, wartość procentowa, natywny progress.
Zachowanie JS: update({value, max, indeterminate}) aktualizuje istniejący pasek.
Brak atrybutu value oznacza postęp nieokreślony.
-->
<div class="ds-component ds-progress" data-ui="progress"><div class="ds-progress-label">Documentation <span data-progress-value>60%</span></div><progress max="100" value="60" aria-label="Documentation"></progress></div>
