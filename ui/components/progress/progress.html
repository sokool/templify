<!--
Component: Progress
Purpose: Show progress for a task with a known or unknown duration.
Elements: Label, percentage value and native progress element.
JavaScript behavior: update({value, max, indeterminate}) updates the existing bar.
Omitting the value attribute indicates indeterminate progress.
-->
<div class="ds-component ds-progress" data-ui="progress"><div class="ds-progress-label">Documentation <span data-progress-value>60%</span></div><progress max="100" value="60" aria-label="Documentation"></progress></div>
