<!--
Component: Quantity input
Purpose: A numeric field with separate decrement/increment buttons.
Elements: Label, native number input and inline validation message.
JavaScript behavior: data-quantity="true" selects minus/plus buttons instead of compact arrows. Buttons use native min/max/step and respect disabled/readonly. No duplicate native spinners are shown.
-->
<div class="ds-component ds-field" data-ui="field-quantity" data-type="number" data-quantity="true">
  <div class="ds-field-caption"><label class="ds-field-label" for="field-quantity-input">Quantity</label><span class="ds-field-error" data-field-error aria-live="polite" hidden></span></div>
  <div class="ds-field-body"><input class="ds-field-control" id="field-quantity-input" type="number" name="quantity" value="1" min="1" max="99" step="1"></div>
</div>
