<!--
Component: Notifications
Purpose: Display an informational, success, warning or error message.
Elements: Title with an icon, message, optional action and dismiss button.
JavaScript behavior: dismiss() hides the notification and emits ui:dismiss.
data-kind="info|success|warning|error" sets appearance; the server sets the status/alert role.
-->
<aside class="ds-component ds-notification" data-ui="notifications" data-kind="success" role="status"><strong class="ds-notification__title"><span aria-hidden="true">✓</span><span>Changes saved</span></strong><p>Your project is ready for the next step.</p><button type="button" class="ds-notification__dismiss ds-focusable" aria-label="Dismiss notification">×</button></aside>
