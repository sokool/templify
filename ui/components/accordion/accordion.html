<!--
Component: Accordion
Purpose: Expandable content sections.
Elements: Container, details sections, summary headings and content panels.
JavaScript behavior: Open/close sections with setOpen(id, open), allow one or multiple
open sections (data-multiple), synchronize aria-expanded and emit ui:change.
Sections still work as native details elements without JavaScript.
-->
<section class="ds-component ds-accordion" data-ui="accordion" data-multiple="true">
  <details class="ds-accordion__item" id="accordion-details" open>
    <summary class="ds-accordion__summary ds-focusable" aria-controls="accordion-panel" aria-expanded="true" id="accordion-summary">Project details</summary>
    <div class="ds-accordion__content" id="accordion-panel" aria-labelledby="accordion-summary">Dimensions, materials and requirements.</div>
  </details>
  <details class="ds-accordion__item" id="accordion-delivery">
    <summary class="ds-accordion__summary ds-focusable">Delivery</summary>
    <div class="ds-accordion__content">Confirm the installation date.</div>
  </details>
</section>
