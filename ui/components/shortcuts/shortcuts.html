<!--
Component: Shortcuts
Purpose: Register and edit keyboard shortcuts.
Elements: Rows with an identifier, label, recorder input and reset button.
JavaScript behavior: set(id, shortcut), reset(id), list(), recording Cmd/Ctrl, Alt and/or
Shift with a letter or digit, or at least two modifiers without a character.
Cmd and Ctrl are interchangeable (Mod). Modifier-only combinations are recorded
and dispatched on the first release, unless another key was pressed.
Backspace/Delete disables a shortcut. ui:change reports changes; the application saves data.
All components register actions in one shared catalogue per document. This editor
adopts existing rows and displays newly registered actions, including Navigation.
Components may declare defaults through their own data-* shortcut attributes;
saved user bindings take precedence. Removing the editor does not disable other
components' shortcuts or destroy the shared catalogue.
ui:shortcut is cancelable: the application handler calls preventDefault() when it
handles the action; only then is the browser's default shortcut blocked.
-->
<section class="ds-component ds-shortcuts" data-ui="shortcuts" aria-label="Keyboard shortcuts"><div class="ds-shortcuts-row" data-shortcut-id="projects.search" data-shortcut="Mod+K"><label>Search projects<input type="text" readonly aria-label="Search projects" value="⌘ / Ctrl + K"></label><button type="button" class="ds-component ds-button ds-focusable" data-ui="buttons"><span data-button-label>Reset</span></button></div></section>
